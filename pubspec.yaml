name: ventus
description: "Ventus — personal travel planning app"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0
  supabase_flutter: ^2.14.0
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  intl: ^0.20.2
  flutter_svg: ^2.3.0
  http: ^1.2.2
  # Disk-backed image cache. Plain Image.network only caches in memory, so
  # every cold start re-downloaded every cover/avatar — wrong for a
  # local-first app. See RetryNetworkImage.
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.1
  file_picker: ^8.0.0
  image_picker: ^1.2.2
  # Pinned to 12.x: 13.x needs win32 ^6, which clashes with file_picker 8.x
  # (win32 ^5). 12.x keeps the same SharePlus.instance API on win32 ^5.
  share_plus: ^12.0.2
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^6.1.3
  crypto: ^3.0.6
  xml: ^6.5.0
  sentry_flutter: ^8.14.2
  vector_map_tiles: 9.0.0-beta.8
  vector_tile_renderer: ^6.1.0
  map_launcher: ^7.0.0
  url_launcher: ^6.3.3
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  drift_dev: ^2.33.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# App icon generation (run: dart run flutter_launcher_icons). Source art is the
# Ventus "V" mark rendered from assets/branding/*.svg.
flutter_launcher_icons:
  image_path: "assets/branding/icon_full.png"
  android: true
  # iOS is deliberately off: the generator rewrites AppIcon.appiconset into the
  # legacy multi-size format, which breaks the icon on iOS 26/27. The iOS icon is
  # the single opaque 1024 PNG, copied by hand from assets/branding/icon_full.png.
  ios: false
  min_sdk_android: 21
  # Android adaptive icon: white "V" on the brand coral.
  adaptive_icon_background: "#F5502F"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"

# Launch screen (run: dart run flutter_native_splash:create). Brand mark centred
# on the warm-coastal background.
flutter_native_splash:
  color: "#F5502F"
  image: "assets/branding/splash_mark_white.png"
  android: true
  ios: true
  android_12:
    image: "assets/branding/splash_mark_white.png"
    color: "#F5502F"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Generates localized AppLocalizations from the ARB files in lib/l10n
  # (configured in l10n.yaml).
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Bundled photos (the Welcome hero) — available on the first frame, offline.
  assets:
    - assets/images/

  # Bundled rather than fetched via google_fonts: the app is local-first, and
  # downloading the faces on first use meant the very first launch (and any
  # offline launch) rendered in the platform fallback and then visibly
  # re-flowed once the real fonts arrived.
  #
  # These are static instances cut from the upstream variable TTFs (SIL Open
  # Font License) with `fonttools varLib.instancer`, one file per weight the
  # design actually uses. A single variable file would have been smaller, but
  # Flutter renders a variable font at its default instance unless the style
  # also sets `fontVariations` — which the hundreds of plain
  # `TextStyle(fontWeight: ...)` call sites across this app do not. Per-weight
  # files make `fontWeight` work everywhere, with no per-call-site ceremony.
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
